name: Instagram Art Bot Scheduler

on:
  schedule:
    # Split by publish mode so delayed scheduled jobs do not depend on wall-clock time.
    - cron: "0 0,3,6,9,15,18 * * *"
    - cron: "0 12,21 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      force_carousel:
        description: 'Force a Carousel post (Ignore schedule)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    # Up to nine carousel children (cover plus featured works) and the parent can require polling.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check dependency lock drift
        run: |
          ./scripts/compile_requirements.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Compile validation
        run: python -m compileall -q main.py src scripts tests

      - name: Run test suite
        run: pytest -q

      - name: Validate production configuration
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python main.py --validate-production-config

      - name: Fetch artwork, process image, and post to Instagram
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          FORCE_CAROUSEL: ${{ github.event.inputs.force_carousel }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          RIJKSMUSEUM_API_KEY: ${{ secrets.RIJKSMUSEUM_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_EXPRESSION" in
              "0 12,21 * * *") python main.py --mode carousel ;;
              "0 0,3,6,9,15,18 * * *") python main.py --mode single ;;
              *) echo "Unsupported production schedule: $SCHEDULE_EXPRESSION" >&2; exit 2 ;;
            esac
          elif [ "$FORCE_CAROUSEL" = "true" ]; then
            python main.py --force-carousel
          else
            python main.py
          fi
