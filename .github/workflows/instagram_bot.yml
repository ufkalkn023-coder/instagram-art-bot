name: Instagram Art Bot Scheduler

"on":
  schedule:
    - cron: "0 5,10,15,20 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      confirm_publish:
        description: "Type PUBLISH_TO_INSTAGRAM to create a REAL Instagram carousel"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  post-to-instagram:
    if: >-
      (github.event_name == 'schedule' &&
       vars.ARTFOLIO_PRODUCTION_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirm_publish == 'PUBLISH_TO_INSTAGRAM')
    runs-on: ubuntu-latest
    # Up to nine carousel children (cover plus featured works) and the parent can require polling.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check dependency lock drift
        run: |
          ./scripts/compile_requirements.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Compile validation
        run: python -m compileall -q main.py src scripts tests

      - name: Run test suite
        run: pytest -q

      - name: Validate production configuration
        env:
          ARTFOLIO_RIGHTS_POLICY: strict_public_domain
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python main.py --validate-production-config

      - name: Fetch artwork, process image, and post to Instagram
        env:
          ARTFOLIO_RIGHTS_POLICY: strict_public_domain
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python main.py --mode carousel
