name: Instagram Art Bot Scheduler

"on":
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      confirm_publish:
        description: "Type PUBLISH_TO_INSTAGRAM to create a REAL Instagram Feed post (carousel or single)"
        required: true
        type: string
      authorization_id:
        description: "Fresh operator-issued UUID matching ARTFOLIO_MANUAL_AUTHORIZATION_ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  post-to-instagram:
    if: >-
      (github.event_name == 'schedule' &&
       vars.ARTFOLIO_PRODUCTION_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirm_publish == 'PUBLISH_TO_INSTAGRAM')
    runs-on: ubuntu-latest
    # Up to nine carousel children (cover plus featured works) and the parent can require polling.
    timeout-minutes: 45

    steps:
      - name: Block publication on GitHub reruns
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'PRODUCTION_RERUN_PUBLICATION_BLOCKED' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check Feed readiness
        id: feed_readiness
        if: github.event_name == 'schedule'
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_STATE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_STATE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY }}
        run: python scripts/manage_feed_schedule.py status --expected-sha "$GITHUB_SHA" --github-output

      - name: Check dependency lock drift
        if: github.event_name == 'workflow_dispatch' || steps.feed_readiness.outputs.ready == 'true'
        run: |
          ./scripts/compile_requirements.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Compile validation
        if: github.event_name == 'workflow_dispatch' || steps.feed_readiness.outputs.ready == 'true'
        run: python -m compileall -q main.py src scripts tests

      - name: Run test suite
        if: github.event_name == 'workflow_dispatch' || steps.feed_readiness.outputs.ready == 'true'
        run: pytest -q

      - name: Preflight normal Feed production
        if: github.event_name == 'workflow_dispatch' || steps.feed_readiness.outputs.ready == 'true'
        env:
          ARTFOLIO_RIGHTS_POLICY: strict_public_domain
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PUBLICATION_ACCESS_TOKEN }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_STATE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_STATE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python main.py --preflight-feed

      - name: Fetch artwork, process image, and post to Instagram
        if: github.event_name == 'workflow_dispatch' || steps.feed_readiness.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTFOLIO_PRODUCTION_SCHEDULE_ENABLED: ${{ vars.ARTFOLIO_PRODUCTION_SCHEDULE_ENABLED }}
          ARTFOLIO_FEED_QUEUE_ENABLED: ${{ vars.ARTFOLIO_FEED_QUEUE_ENABLED }}
          ARTFOLIO_CAPTION_EXPERIMENT_ENABLED: ${{ vars.ARTFOLIO_CAPTION_EXPERIMENT_ENABLED }}
          ARTFOLIO_CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          ARTFOLIO_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          ARTFOLIO_MANUAL_AUTHORIZATION_ID: ${{ vars.ARTFOLIO_MANUAL_AUTHORIZATION_ID }}
          ARTFOLIO_MANUAL_AUTHORIZATION_ISSUED_AT: ${{ vars.ARTFOLIO_MANUAL_AUTHORIZATION_ISSUED_AT }}
          ARTFOLIO_RIGHTS_POLICY: strict_public_domain
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PUBLICATION_ACCESS_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ vars.ARTFOLIO_GEMINI_ENABLED == 'true' && secrets.GOOGLE_GEMINI_API_KEY || '' }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_STATE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_STATE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python main.py --mode auto

      - name: Report consolidated Feed status changes
        if: always() && vars.ARTFOLIO_FEED_STATUS_ENABLED == 'true'
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_STATE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_STATE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY }}
        run: python scripts/report_feed_status.py --r2 --notify --expected-sha "$GITHUB_SHA"
