name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check dependency lock drift
        run: |
          ./scripts/compile_requirements.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Compile validation
        run: python -m compileall -q main.py src scripts tests

      - name: Run test suite
        run: pytest -q
