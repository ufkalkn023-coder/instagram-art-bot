name: Check editorial Feed stock

"on":
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CHECK_EDITORIAL_FEED to inspect stock; no queue writes or publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: artfolio-feed-queue-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'CHECK_EDITORIAL_FEED') ||
       (github.event_name == 'schedule' && vars.ARTFOLIO_FEED_QUEUE_REFILL_ENABLED == 'true' &&
        vars.ARTFOLIO_FEED_QUEUE_ENABLED == 'true' && vars.ARTFOLIO_PRODUCTION_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Block reruns
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'EDITORIAL_STOCK_CHECK_RERUN_BLOCKED' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check editorial stock
        id: refill
        env:
          ARTFOLIO_FEED_CONTENT_MODE: automatic
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_STATE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_STATE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY }}
        run: python scripts/prepare_feed_queue.py --directory "$RUNNER_TEMP/feed-queue" --r2 --skip-keychain --check-refill --early --expected-sha "$GITHUB_SHA" --github-output
      - name: Verify queue implementation
        if: github.event_name == 'workflow_dispatch'
        run: pytest -q tests/test_feed_queue.py tests/test_r2_feed_queue.py tests/test_feed_queue_refill.py tests/test_feed_queue_rights.py tests/test_feed_queue_runtime.py tests/test_editorial_production.py
