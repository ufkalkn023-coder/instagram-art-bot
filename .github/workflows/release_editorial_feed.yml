name: Release reviewed editorial Feed

"on":
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, activate]
        default: inspect
      expected_sha:
        description: "Exact reviewed main commit"
        type: string
        required: true
      expected_generation:
        description: "Generation returned by inspect; required for activate"
        type: string
      cadence:
        description: "Preserve policy, or explicitly activate four daily Feed slots"
        type: choice
        options: [preserve, six_hourly_utc17]
        default: preserve
      confirmation:
        description: "Activate only: DEPLOY_REVIEWED_EDITORIAL_FEED"
        type: string

permissions:
  contents: read

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (inputs.operation == 'inspect' || inputs.confirmation == 'DEPLOY_REVIEWED_EDITORIAL_FEED')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Require exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify release and schedule guards
        run: python -m pytest -q tests/test_editorial_release.py tests/test_feed_schedule.py tests/test_continuous_feed_schedule.py tests/test_hourly_feed_schedule.py tests/test_six_hour_feed_schedule.py
      - name: Inspect or activate reviewed release
        env:
          CADENCE: ${{ inputs.cadence }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_STATE_R2_BUCKET_NAME }}
          CLOUDFLARE_STATE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_STATE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          args=(--expected-sha "$EXPECTED_SHA")
          if [ "$OPERATION" = activate ]; then
            args+=(--apply --expected-generation "$EXPECTED_GENERATION" --evidence-ref "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            if [ "$CADENCE" = six_hourly_utc17 ]; then
              args+=(--cadence "$CADENCE")
            fi
          fi
          python scripts/release_editorial_feed.py "${args[@]}"
