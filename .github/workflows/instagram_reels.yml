name: Instagram Reel Production Scheduler

"on":
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type PUBLISH_REEL_TO_INSTAGRAM to produce and publish one REAL Instagram Reel"
        required: true
        type: string
  schedule:
    - cron: "0 7,12,17,22 * * *"

permissions:
  contents: read

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  produce-one-reel:
    if: >-
      (github.event_name == 'schedule' &&
       vars.ARTFOLIO_REEL_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirm_publish == 'PUBLISH_REEL_TO_INSTAGRAM')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate pinned artfolio-reels ref
        env:
          ARTFOLIO_REELS_PRODUCTION_REF: ${{ vars.ARTFOLIO_REELS_PRODUCTION_REF }}
        run: |
          if ! printf '%s' "$ARTFOLIO_REELS_PRODUCTION_REF" | grep -Eq '^[0-9a-f]{40}$|^stable-[A-Za-z0-9][A-Za-z0-9_-]*$'; then
            echo "ARTFOLIO_REELS_PRODUCTION_REF must be a full 40-character commit SHA or a stable- prefixed immutable tag; floating branches such as main are not allowed." >&2
            exit 1
          fi

      - name: Checkout pinned artfolio-reels repository
        uses: actions/checkout@v5
        with:
          repository: ufkalkn023-coder/artfolio-reels
          ref: ${{ vars.ARTFOLIO_REELS_PRODUCTION_REF }}
          path: artfolio-reels
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check dependency lock drift
        run: |
          ./scripts/compile_requirements.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Set up Node from artfolio-reels .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: artfolio-reels/.node-version

      - name: Install artfolio-reels dependencies
        run: npm ci
        working-directory: artfolio-reels

      - name: Compile validation
        run: python -m compileall -q main.py src scripts tests

      - name: Run test suite
        run: pytest -q

      - name: Validate production configuration
        env:
          ARTFOLIO_RIGHTS_POLICY: strict_public_domain
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python main.py --validate-production-config

      - name: Reconcile Reel publications
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python scripts/reconcile_reels.py

      - name: Produce and publish one Reel
        env:
          ARTFOLIO_RIGHTS_POLICY: strict_public_domain
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python scripts/produce_reel.py --artfolio-reels-root artfolio-reels
