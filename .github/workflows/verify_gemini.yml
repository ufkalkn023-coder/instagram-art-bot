name: Verify Gemini editorial generation

"on":
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'VERIFY_GEMINI: two bounded paid model calls, local previews, no Instagram post'
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.confirmation == 'VERIFY_GEMINI' && vars.ARTFOLIO_GEMINI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Generate single and carousel previews
        env:
          GOOGLE_GEMINI_API_KEY: ${{ vars.ARTFOLIO_GEMINI_ENABLED == 'true' && secrets.GOOGLE_GEMINI_API_KEY || '' }}
        run: python scripts/verify_gemini.py --output gemini-verification --format both
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-editorial-verification
          path: gemini-verification/
          retention-days: 3
